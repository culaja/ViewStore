name: PublishNugets

on:
  push:
    branches: [ published, release-1.3.X ]
  pull_request:
    branches: [ published ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.102
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test
    - name: Package ViewStore.Abstractions
      run: dotnet pack -c Release -o . Abstractions/Abstractions.csproj
    - name: Package ViewStore.Abstractions
      run: dotnet pack -c Release -o . Cache/ViewStore.Cache/ViewStore.Cache.csproj
    - name: Package ViewStore.Abstractions
      run: dotnet pack -c Release -o . Postgres/ViewStore.Postgres/ViewStore.Postgres.csproj
    - name: Package ViewStore.Abstractions
      run: dotnet pack -c Release -o . Prometheus/ViewStore.Prometheus/ViewStore.Prometheus.csproj
    - name: Push NuGet package
      run: dotnet nuget push "*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json" --skip-duplicate
